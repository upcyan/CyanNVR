services:
  cyannvr:
    build: .
    container_name: cyannvr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NVR_PORT=8080
      - NVR_DATA=/data
      - NVR_WEB=/app/dist
      # JWT 密钥留空则服务端自动生成并持久化到 /data/jwt_secret（推荐）
      - NVR_JWT_SECRET=${NVR_JWT_SECRET:-}
      - NVR_ADMIN_PASSWORD=${NVR_ADMIN_PASSWORD:-admin123}
      # AI 画面识别：local=本地对象检测(默认,内置YOLOv8) openai=云端视觉模型
      - NVR_AI_ENABLED=${NVR_AI_ENABLED:-true}
      - NVR_AI_MODE=${NVR_AI_MODE:-local}
      - NVR_AI_DETECT_URL=${NVR_AI_DETECT_URL:-http://127.0.0.1:11435}
      - NVR_AI_BASE_URL=${NVR_AI_BASE_URL:-http://host.docker.internal:11434/v1}
      - NVR_AI_MODEL=${NVR_AI_MODEL:-person-detection}
      - NVR_AI_API_KEY=${NVR_AI_API_KEY:-}
      - NVR_AI_CONF=${NVR_AI_CONF:-0.20}
      - NVR_AI_CLASSES=${NVR_AI_CLASSES:-person,car,truck,bicycle,motorcycle,bus,dog,cat}
    volumes:
      - ./server/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 局域网 ONVIF 发现需网卡多播，如需使用请打开 network_mode: host（Linux）
    # network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s