<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="CyanNVR">
  <title>CyanNVR</title>
  <!--
    设计：极简镜头 + 录制指示（扁平化 2.0）
      外圈圆环          -> 摄像机镜头，安防 / NVR 的直接指代
      实心瞳孔          -> 镜头玻璃，简洁有力
      高光弧线          -> 玻璃反光，增加立体感但不臃肿
      右上红点          -> 录制中，点出录像机的核心职能
    几何数值与 fpk/gen-icons.py 的常量一一对应，改动时请同步两处。
    与旧版差异：去掉多层高光，改用单条弧线；瞳孔更大更居中；整体更扁平现代。
  -->
  <!-- 镜筒外圈：r = 30，stroke-width = 8 -->
  <circle cx="44" cy="54" r="30" fill="none" stroke="#2ea8ff" stroke-width="8"/>
  <!-- 玻璃镜片：更大更居中 -->
  <circle cx="44" cy="54" r="22" fill="#2ea8ff"/>
  <!-- 高光弧线：替代旧版双圆点，更简洁 -->
  <path d="M 32 44 A 16 16 0 0 1 44 38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- 录制指示点：更大更醒目 -->
  <circle cx="78" cy="24" r="9" fill="#ff4d4f"/>
</svg>
