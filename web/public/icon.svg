<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="CyanNVR">
  <title>CyanNVR</title>
  <!--
    设计：镜头 + 录制指示
      外圈 + 玻璃镜片   -> 摄像机镜头，安防 / NVR 的直接指代
      左上高光          -> 让它读起来是玻璃镜片，而不是靶心
      右上红点          -> 录制中，点出录像机的核心职能
    几何数值与 fpk/gen-icons.py 的常量一一对应，改动时请同步两处。
  -->
  <!-- 镜筒外圈：r = (32 + 24.5) / 2，stroke-width = 32 - 24.5 -->
  <circle cx="44" cy="54" r="28.25" fill="none" stroke="#2ea8ff" stroke-width="7.5"/>
  <!-- 玻璃镜片 -->
  <circle cx="44" cy="54" r="20" fill="#2ea8ff"/>
  <!-- 高光 -->
  <circle cx="36" cy="46" r="6" fill="#ffffff" fill-opacity="0.88"/>
  <circle cx="50" cy="62" r="2.5" fill="#ffffff" fill-opacity="0.3"/>
  <!-- 录制指示点 -->
  <circle cx="80" cy="22" r="7.5" fill="#ff4d4f"/>
</svg>
