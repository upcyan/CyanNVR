<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" rx="20" fill="#0f1115"/>
  
  <!-- 监控摄像头主体 -->
  <g fill="none" stroke="#2ea8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 摄像头外壳 -->
    <rect x="20" y="30" width="45" height="35" rx="8"/>
    <!-- 镜头 -->
    <circle cx="42" cy="47" r="12"/>
    <circle cx="42" cy="47" r="6" fill="#2ea8ff"/>
    <!-- 镜头反光 -->
    <circle cx="38" cy="43" r="2" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- AI 智能识别框 -->
  <g fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,2">
    <rect x="65" y="25" width="15" height="15" rx="2"/>
    <rect x="65" y="60" width="15" height="15" rx="2"/>
    <rect x="20" y="60" width="15" height="15" rx="2"/>
  </g>
  
  <!-- 录像指示灯 -->
  <circle cx="75" cy="47" r="4" fill="#ff4444"/>
  
  <!-- 底部文字 -->
  <text x="50" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">CyanNVR</text>
</svg>
