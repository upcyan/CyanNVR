<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" rx="20" fill="#0f1115"/>
  
  <!-- 简化摄像头 -->
  <g transform="translate(50,45)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2ea8ff" stroke-width="3"/>
    <!-- 内圈 -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#2ea8ff" stroke-width="2"/>
    <!-- 瞳孔 -->
    <circle cx="0" cy="0" r="8" fill="#2ea8ff"/>
    <!-- 反光 -->
    <circle cx="-3" cy="-3" r="2" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- AI 指示 -->
  <circle cx="70" cy="30" r="3" fill="#00ff88"/>
  <circle cx="70" cy="60" r="3" fill="#00ff88"/>
  <circle cx="30" cy="60" r="3" fill="#00ff88"/>
  
  <!-- 录像指示灯 -->
  <circle cx="75" cy="25" r="4" fill="#ff4444"/>
  
  <!-- 底部文字 -->
  <text x="50" y="88" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">CyanNVR</text>
</svg>
